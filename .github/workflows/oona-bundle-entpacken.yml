name: Oona-Bundle entpacken

# Einmal-Werkzeug: setzt das per Web-Upload in Teilen hochgeladene Paket (oona-bundle/)
# zusammen und legt es über oona/ + oona-src/ (Update-Pakete überschreiben nur enthaltene Dateien).
on:
  push:
    branches: [ main ]
    paths: [ 'oona-bundle/READY' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zusammensetzen, prüfen, entpacken
        run: |
          cat oona-bundle/oona.tar.part-* > /tmp/oona.tar
          echo "$(cat oona-bundle/oona.tar.sha256)  /tmp/oona.tar" | sha256sum -c -
          tar -xf /tmp/oona.tar
          git rm -rq oona-bundle
          rm -rf oona-bundle
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Oona-Portfolio: oona/ (Website) + oona-src/ (Quellen) entpackt"
          git push
